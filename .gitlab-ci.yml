    - echo "=== Checking built bundle for API URLs ==="
    - grep -o "https://api[^\"']*" dist/assets/*.js | head -3 || echo "No API URLs found in bundle"
    - npx wrangler pages deploy dist --project-name=budget-wise-pwa-dev --branch=develop
  environment:
    name: staging
    url: https://develop.${CF_PROJECT_NAME}.pages.dev
