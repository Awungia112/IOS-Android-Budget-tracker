# PACKAGE
# ==============================================================================

package:android:
  stage: package
  tags: [aws-2xlarge]
  needs:
    - build:mobile:staging
  image: thyrlian/android-sdk:latest
  variables:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
  before_script:
    - apt-get update -qq
    - apt-get install -y openjdk-21-jdk curl
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    # FIX: Use corepack consistently
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - |
      if [ -z "$GOOGLE_PLAY_SIGNING_KEYSTORE_BASE64" ]; then
        echo "FATAL: GOOGLE_PLAY_SIGNING_KEYSTORE_BASE64 is not set" >&2
        exit 1
      fi
    - |
      set -e
      echo "$GOOGLE_PLAY_SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$CI_PROJECT_DIR/android-signing-keystore.jks"
      if [ ! -s "$CI_PROJECT_DIR/android-signing-keystore.jks" ]; then
        echo "FATAL: Keystore decode produced empty file — check GOOGLE_PLAY_SIGNING_KEYSTORE_BASE64" >&2
        exit 1
      fi
    # Verify keystore is valid before proceeding
    - keytool -list -keystore $CI_PROJECT_DIR/android-signing-keystore.jks -storepass $KEYSTORE_PASSWORD -noprompt
    - export KEYSTORE_PATH="$CI_PROJECT_DIR/android-signing-keystore.jks"
    - echo "Environment:" && node --version && pnpm --version && java -version
    - echo "=== Android package env ==="
    - echo "VITE_API_BASE_URL=${VITE_API_BASE_URL:-<unset>}"
    - echo "VITE_RECOVERY_SERVER_URL=${VITE_RECOVERY_SERVER_URL:-<unset>}"
    - echo "CAPACITOR_SERVER_HOSTNAME=${CAPACITOR_SERVER_HOSTNAME:-<unset>}"
    - export CAPACITOR_SERVER_HOSTNAME="${CAPACITOR_SERVER_HOSTNAME:-app.prod.dip.on.adorsys.com}"
    - echo "Resolved Android package values:"
    - echo "  CAPACITOR_SERVER_HOSTNAME=$CAPACITOR_SERVER_HOSTNAME"
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec cap sync android
    - |
      set -e
      # 1. Ensure the tag exists
      if [ -z "$CI_COMMIT_TAG" ]; then
        echo "FATAL: CI_COMMIT_TAG is not set. This job must be triggered by a tag." >&2
        exit 1
      fi

      # 2. Validate format (e.g., v1.2.3 or v1.2.3-test)
      # Using POSIX grep -qE instead of bash [[ =~ ]] — thyrlian/android-sdk may use sh
      if ! echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$'; then
        echo "FATAL: Tag '$CI_COMMIT_TAG' does not match versioning schema (vX.Y.Z)." >&2
        exit 1
      fi

      # 3. Strip the 'v' prefix and build — all in the same shell so VERSION_NAME is in scope
      VERSION_NAME="${CI_COMMIT_TAG#v}"
      VERSION_CODE="$((VERSION_CODE_OFFSET + CI_PIPELINE_IID))"
      echo "Building Version: $VERSION_NAME (code: $VERSION_CODE)"
      cd android
      ./gradlew clean bundleRelease assembleRelease \
        -PVERSION_CODE="$VERSION_CODE" \
        -PVERSION_NAME="$VERSION_NAME" \
        --no-daemon
  artifacts:
    paths:
      - android/app/build/outputs/bundle/release/app-release.aab
      - android/app/build/outputs/apk/release/app-release.apk
    expire_in: 1 week
  after_script:
    # FIX: Use full path — working dir in after_script is not guaranteed to be CI_PROJECT_DIR
    - rm -f $CI_PROJECT_DIR/android-signing-keystore.jks
  rules:
    # Run on test tags only
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-test-\d+$/

