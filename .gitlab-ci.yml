# GitLab CI/CD Pipeline for Budget Wise PWA
# Deploys to Cloudflare Pages
# Uses pnpm + Nx monorepo

# ==============================================================================
# SECURITY TEMPLATES
# ==============================================================================
# GitLab-managed SAST (semgrep analyzer, auto-detects TypeScript) and Secret
# Detection jobs. Both run in the 'security' stage on every MR and branch push.
# Findings appear in the pipeline Security tab (Free tier). The MR security
# widget requires GitLab Ultimate.

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# ==============================================================================
# WORKFLOW RULES
# ==============================================================================
# Ensures branch pipelines run for main/develop pushes alongside MR pipelines.
# Without this, GitLab may only create MR pipelines, skipping jobs that require
# $CI_COMMIT_BRANCH == "main" (like push-server-image).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "qa"
    - if: $CI_COMMIT_TAG

# ==============================================================================
# YAML ANCHORS
# ==============================================================================

# Base setup for Android Fastlane jobs.
# NOTE: Jobs using this anchor must NOT redefine before_script,
# as YAML merge does not deep-merge arrays — the local key would win.
# Instead, extend setup steps inside the script section or use extends:.
.android-fastlane-setup: &android-fastlane-setup
  image: ruby:3.2
  before_script:
    - gem install fastlane --no-document
    - |
      if [ -z "$GOOGLE_PLAY_JSON_KEY" ]; then
      echo "FATAL: GOOGLE_PLAY_JSON_KEY is not set in GitLab CI Variables" >&2
      exit 1
      fi
    # Decode the Play Store service account key
    - echo "$GOOGLE_PLAY_JSON_KEY" | tr -d '[:space:]' | base64 -d > $CI_PROJECT_DIR/google-play-key.json
    # Export the path so Fastlane's GOOGLE_PLAY_JSON_KEY_PATH resolves correctly
    - export GOOGLE_PLAY_JSON_KEY_PATH="$CI_PROJECT_DIR/google-play-key.json"
    # Export the AAB path so Fastlane's ANDROID_AAB_PATH resolves correctly
    - export ANDROID_AAB_PATH="$CI_PROJECT_DIR/android/app/build/outputs/bundle/release/app-release.aab"
    # Export the APK path so Fastlane's ANDROID_APK_PATH resolves correctly (legacy APK track)
    - export ANDROID_APK_PATH="$CI_PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"
    # Set package name (add ANDROID_PACKAGE_NAME to GitLab CI/CD variables too)
    - export ANDROID_PACKAGE_NAME="${ANDROID_PACKAGE_NAME}"

# ==============================================================================
# PIPELINE STRUCTURE
# ==============================================================================

stages:
  - install
  - quality
  - build
  - package
  - deploy

variables:
  NODE_VERSION: "24"
  PNPM_VERSION: "9"
  CF_PROJECT_NAME: "budget-wise-pwa"
  PNPM_CACHE_FOLDER: .pnpm-store
  # Exclude dependency store and build output directories from SAST scanning.
  # These contain third-party package source files, not application code.
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, .pnpm-store, node_modules, dist"
  # Default parallelism ceiling for Nx jobs
  NX_PARALLEL_MAX: "4"
  # Prevent Playwright from downloading browser binaries during pnpm install.
  # The e2e job uses mcr.microsoft.com/playwright which has browsers pre-installed.
  # Without this, every job that runs pnpm install would download ~340MB of browsers.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

# Cache pnpm store between pipelines.
# Key is based on the lockfile hash — shared across all branches with the same
# dependency tree, so cache is warm on the first run of any new branch.
cache:
  key:
    files:
      - pnpm-lock.yaml
  fallback_keys:
    - pnpm-lock-fallback-${NODE_VERSION}
  paths:
    - .pnpm-store/

# YAML anchor for Nx-based jobs
.nx-setup: &nx-setup
  before_script:
    - apk add --no-cache git
    - git fetch origin develop --depth=1
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate

.aws-ecr-docker-job:
  stage: deploy
  image: docker:latest
  tags: [aws-2xlarge]
  services:
    - docker:dind
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.adorsys.de
  variables:
    GITLAB_OIDC_TOKEN_FILE: $CI_PROJECT_DIR/.oidc_token
    AWS_DEFAULT_REGION: eu-central-1
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "$GITLAB_OIDC_TOKEN" > "$GITLAB_OIDC_TOKEN_FILE"
    - apk add --no-cache aws-cli
    - |
      assume_aws_role() {
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
        aws_sts_output=$(aws sts assume-role-with-web-identity \
          --role-arn "$1" \
          --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
          --web-identity-token file://${GITLAB_OIDC_TOKEN_FILE} \
          --duration-seconds 3600 \
          --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
          --output text)
        export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)
      }

      ecr_login() {
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
          | docker login --username AWS --password-stdin "$1"
      }
  after_script:
    - rm -f "$GITLAB_OIDC_TOKEN_FILE"

# ==============================================================================
# SAST & SECRET DETECTION (template overrides)
# ==============================================================================
# The SAST and Secret Detection templates default all jobs to stage: test.
# Since this pipeline uses custom stage names, every concrete template job
# that references the test stage must be explicitly overridden to point at
# the security stage. Hidden jobs (prefixed with .) do not trigger the stage
# validator and do not need overriding.
#
# Concrete jobs overridden:
#   sast             -- parent job defined by SAST template, stage: test
#   semgrep-sast     -- the only SAST analyzer that runs for TypeScript
#   secret_detection -- Secret Detection concrete job
#
# Reference: https://docs.gitlab.com/ee/user/application_security/detect/security_configuration

sast:
  stage: quality

semgrep-sast:
  stage: quality
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

secret_detection:
  stage: quality
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ==============================================================================
# INSTALL
# ==============================================================================

install:
  stage: install
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir $PNPM_CACHE_FOLDER
  script:
    - pnpm install --frozen-lockfile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  artifacts:
    paths:
      - node_modules/
      - packages/*/node_modules/
    # 2 hours gives queued quality jobs enough runway even under runner contention
    expire_in: 2 hours

# ==============================================================================
# AI REVIEW (Snif — replaces Qodo Merge / PR-Agent)
# ==============================================================================
# Posts inline MR discussions with code review findings.
# Auto-detects GitLab from CI_PROJECT_PATH and CI_MERGE_REQUEST_IID.
# allow_failure: true so a flaky AI endpoint never blocks a merge.

snif_review:
  stage: quality
  image: debian:bookworm-slim
  tags: [aws-2xlarge]
  needs: []
  allow_failure: true
  interruptible: true
  resource_group: ai_review
  timeout: 30m
  variables:
    SNIF_VERSION: "3.3.0"
    SNIF_API_KEY: $KIVOYO_AI_KEY
    SNIF_ENDPOINT: $KIVOYO_AI_URL
    GITLAB_TOKEN: $GITLAB_PERSONAL_ACCESS_TOKEN
    RUST_LOG: info
  before_script:
    - apt-get update && apt-get install -y curl git xz-utils ca-certificates sqlite3
    - curl -sSLf "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64" -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
    - curl -sSLf "https://github.com/AssahBismarkabah/Snif/releases/download/v${SNIF_VERSION}/snif-cli-x86_64-unknown-linux-gnu.tar.xz" -O
    - curl -sSLf "https://github.com/AssahBismarkabah/Snif/releases/download/v${SNIF_VERSION}/snif-cli-x86_64-unknown-linux-gnu.tar.xz.sha256" -O
    - curl -sSLf "https://github.com/AssahBismarkabah/Snif/releases/download/v${SNIF_VERSION}/snif-cli-x86_64-unknown-linux-gnu.tar.xz.sha256.sig" -O
    - curl -sSLf "https://github.com/AssahBismarkabah/Snif/releases/download/v${SNIF_VERSION}/snif-cli-x86_64-unknown-linux-gnu.tar.xz.sha256.pem" -O
    - cosign verify-blob snif-cli-x86_64-unknown-linux-gnu.tar.xz.sha256
        --signature snif-cli-x86_64-unknown-linux-gnu.tar.xz.sha256.sig
        --certificate snif-cli-x86_64-unknown-linux-gnu.tar.xz.sha256.pem
        --certificate-identity "https://github.com/AssahBismarkabah/Snif/.github/workflows/sign-release.yml@refs/heads/main"
        --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
    - sha256sum -c snif-cli-x86_64-unknown-linux-gnu.tar.xz.sha256
    - tar xJf snif-cli-x86_64-unknown-linux-gnu.tar.xz
    - mv snif-cli-x86_64-unknown-linux-gnu/snif /usr/local/bin/snif
  cache:
    key: snif-${SNIF_VERSION}-deepseek-v4-flash
    paths:
      - .snif/
  script:
    - test -f .snif/index.db && sqlite3 .snif/index.db 'SELECT COUNT(*) AS summaries FROM summaries;' || true
    - snif index --path .
    - test -f .snif/index.db && sqlite3 .snif/index.db 'SELECT COUNT(*) AS summaries FROM summaries;' || true
    - snif review --path .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ==============================================================================
# QUALITY
# ==============================================================================

lint:
  stage: quality
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  extends: .nx-setup
  script:
    - |
      PARALLEL=$(nproc 2>/dev/null || echo 3)
      [ "$PARALLEL" -gt "$NX_PARALLEL_MAX" ] && PARALLEL=$NX_PARALLEL_MAX
      npx nx run-many -t lint --parallel=$PARALLEL
  needs:
    - install
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

test:
  stage: quality
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  extends: .nx-setup
  script:
    - |
      set -e
      export NODE_OPTIONS="--max-old-space-size=4096"
      export NX_DAEMON=false
      export NX_VERBOSE_LOGGING=false
      git fetch origin develop --depth=1
      mkdir -p coverage

      PARALLEL=$(nproc 2>/dev/null || echo 3)
      [ "$PARALLEL" -gt "$NX_PARALLEL_MAX" ] && PARALLEL=$NX_PARALLEL_MAX

      # Run tests. nx affected exits 0 even when no tasks match, which silently
      # skips all tests — so we always use run-many to ensure nothing is missed.
      set +e
      npx nx run-many -t test --parallel=$PARALLEL
      TEST_EXIT=$?
      set -e

      # Generate coverage separately so an OOM during report writing does not
      # fail the test job. Artifacts are uploaded with when:always.
      set +e
      npx vitest run --coverage --reporter=dot
      set -e

      # Ensure coverage dir has at least a placeholder so artifact upload works.
      if [ -z "$(ls -A coverage 2>/dev/null)" ]; then
        echo '{"note":"no coverage data generated"}' > coverage/.coverage-placeholder
      fi

      exit $TEST_EXIT
    - install
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/**/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week

test:integration:
  stage: quality
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  extends: .nx-setup
  script:
    - |
      set -e
      export NODE_OPTIONS="--max-old-space-size=4096"
      export NX_DAEMON=false
      export NX_VERBOSE_LOGGING=false
      # Integration tests must not inherit deployed environment URLs from
      # GitLab variables; otherwise MSW can pass through to DEV/QA APIs.
      export VITE_API_BASE_URL=""
      export VITE_RECOVERY_SERVER_URL=""
      export VITE_EMAIL_HASH_PEPPER=""
      npx nx run-many -t test:integration --parallel=3
  needs:
    - install
  allow_failure: false
  timeout: 10m
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/integration/**/cobertura-coverage.xml
      junit: coverage/integration/**/junit.xml
    paths:
      - coverage/integration
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

test:schema:
  stage: quality
  image: node:${NODE_VERSION}-alpine
  interruptible: true
  script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm install --frozen-lockfile --prefer-offline --reporter=silent
    - pnpm run test:schema
  needs:
    - install
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

e2e:
  stage: build
  image: mcr.microsoft.com/playwright:v1.59.1-jammy
  tags: [aws-2xlarge]
  interruptible: true
  timeout: 25m
  parallel: 8
  needs:
    - install
    - build   # provides dist/ and packages/*/dist/ — vite preview serves these directly
  before_script:
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm config set store-dir $PNPM_CACHE_FOLDER
  script:
    # Optimization: reused node_modules from 'install' job (glibc-compatible).
    # The Playwright image already contains matching browser binaries, so the
    # app postinstall skips browser downloads in CI.
    - pnpm install --frozen-lockfile --prefer-offline --reporter=silent
    # Fallback build: if build job skipped @budget/app (affected detection), build it now.
    # This ensures dist/ exists for vite preview even on CI-only or docs-only MRs.
    - |
      if [ ! -d "packages/app/dist" ] || [ -z "$(ls -A packages/app/dist 2>/dev/null)" ]; then
        echo "WARNING: dist/ missing or empty — building @budget/shared, @budget/core then @budget/app (slow path)"
        export VITE_API_BASE_URL="${VITE_API_BASE_URL:-}"
        export VITE_RECOVERY_SERVER_URL="${VITE_RECOVERY_SERVER_URL:-}"
        export VITE_EMAIL_HASH_PEPPER="${VITE_EMAIL_HASH_PEPPER:-}"
        export VITE_ENABLE_REMEDIATION_PHASE2="${VITE_ENABLE_REMEDIATION_PHASE2:-}"
        pnpm --filter @budget/shared run build
        pnpm --filter @budget/core run build
        pnpm --filter @budget/app run build
      else
        echo "dist/ found — using build artifact"
      fi
    # playwright.config.ts webServer runs 'vite preview' which serves dist/ directly.
    # Call playwright directly (not via pnpm script) so --shard flag is not escaped by pnpm.
    - cd packages/app && pnpm exec playwright test --shard=${CI_NODE_INDEX}/${CI_NODE_TOTAL}
  artifacts:
    paths:
      - packages/app/playwright-report/
      - packages/app/test-results/
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

lighthouse:
  stage: build
  tags: [aws-2xlarge]
  interruptible: true
  timeout: 15m
  # Cypress browsers image chosen for Lighthouse CI because:
  # - Pre-installed with Chrome, Node, and all necessary system libraries
  # - Stable, well-maintained image specifically designed for browser testing
  # - Includes proper Chrome versions compatible with Lighthouse
  # - Alternative: official lighthouse-ci/lighthouseci image (smaller, more focused)
  image: cypress/browsers:node-24.15.0-chrome-148.0.7778.96-1-ff-150.0.3-edge-148.0.3967.54-1
  needs:
    - install
    - build   # provides dist/ — lighthouserc.cjs startServerCommand runs 'vite preview' which serves dist/
  variables:
    # Use the pnpm store from your global cache
    PNPM_HOME: ".pnpm-store"
    # Comprehensive set of flags for running Chrome as root in CI
    LHCI_COLLECT_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage --headless=new --disable-gpu --disable-software-rasterizer"
    # Some versions/environments respond to this variant
    CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage --headless=new"
  before_script:
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm config set store-dir $PNPM_CACHE_FOLDER
  script:
    # Optimization: reused node_modules from 'install' job (glibc-compatible)
    - pnpm install --frozen-lockfile --prefer-offline --reporter=silent
    # Fallback build: if build job skipped @budget/app (affected detection), build it now.
    # This ensures dist/ exists for vite preview even on CI-only or docs-only MRs.
    - |
      if [ ! -d "packages/app/dist" ] || [ -z "$(ls -A packages/app/dist 2>/dev/null)" ]; then
        echo "WARNING: dist/ missing or empty — building @budget/shared, @budget/core then @budget/app (slow path)"
        pnpm --filter @budget/shared run build
        pnpm --filter @budget/core run build
        pnpm --filter @budget/app run build
      else
        echo "dist/ found — using build artifact"
      fi
    # lighthouserc.cjs startServerCommand runs 'vite preview' which serves dist/ directly.
    - cd packages/app && pnpm exec lhci autorun --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage --headless=new"
  artifacts:
    paths:
      - packages/app/.lighthouseci/
    # If the job fails (assertion error), we still want the report
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"

dependency-audit:
  stage: quality
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  needs: [install]
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
  script:
    - pnpm audit --audit-level=high
  # TODO: Set allow_failure: false once existing vulnerabilities are resolved
  # This prevents blocking MRs while we address current security issues
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

trivy-scan:
  stage: quality
  tags: [aws-2xlarge]
  needs: [install]
  # Trivy DB cache is keyed by version only (not branch) so all branches share
  # the same downloaded vulnerability database — avoids re-downloading per branch.
  cache:
    key: trivy-db-0.69.3
    paths:
      - .cache/trivy
  image:
    name: aquasec/trivy:0.69.3
    entrypoint: [""]
  script:
    - mkdir -p .cache/trivy
    - trivy filesystem --severity HIGH,CRITICAL --format json --output trivy-report.json --cache-dir .cache/trivy --exit-code 0 .
    # Optimized: convert JSON to table instead of re-scanning filesystem
    - trivy convert --format table --exit-code 1 trivy-report.json
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 1 week
  # TODO: Set allow_failure: false once existing vulnerabilities are resolved
  # This prevents blocking releases while we address current security issues
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# ------------------------------
# Build Application
# ------------------------------
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  extends: .nx-setup
  script:
    # Build all packages. We use run-many instead of affected because:
    # - nx affected exits 0 when no tasks match (e.g. on the branch used as --base),
    #   which silently skips the entire build and deploys an empty dist/ to Cloudflare Pages.
    # - With only 4 build targets (core, app, server, recovery-server), the affected
    #   optimization saves negligible time and breaks deployments.
    #
    # VITE_* variables come from GitLab CI/CD variables (set with * scope so all
    # pipelines have them). Deploy jobs rebuild the PWA with environment-specific
    # values, but this build needs them too for integration/e2e tests.
    - |
      PARALLEL=$(nproc 2>/dev/null || echo 3)
      [ "$PARALLEL" -gt "$NX_PARALLEL_MAX" ] && PARALLEL=$NX_PARALLEL_MAX
      export VITE_API_BASE_URL="${VITE_API_BASE_URL:-}"
      export VITE_RECOVERY_SERVER_URL="${VITE_RECOVERY_SERVER_URL:-}"
      export VITE_EMAIL_HASH_PEPPER="${VITE_EMAIL_HASH_PEPPER:-}"
      export VITE_ENABLE_REMEDIATION_PHASE2="${VITE_ENABLE_REMEDIATION_PHASE2:-}"
      npx nx run-many -t build --parallel=$PARALLEL
  artifacts:
    paths:
      - dist/
      - packages/*/dist/
    expire_in: 1 week
  needs:
    - install
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

typecheck:
  stage: build
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  extends: .nx-setup
  script:
    - npx nx run-many -t typecheck
  needs:
    - install
    - build
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Build PWA specifically for mobile packaging - Staging environment
build:mobile:staging:
  stage: build
  image: node:${NODE_VERSION}
  tags: [aws-2xlarge]
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir $PNPM_CACHE_FOLDER
  needs:
    - install
  script:
    # node_modules from 'install' are glibc-compatible; simple prune/check is enough
    - pnpm install --frozen-lockfile --prefer-offline --reporter=silent
    - echo "=== Mobile build env ==="
    - echo "VITE_API_BASE_URL=${VITE_API_BASE_URL:-<unset>}"
    - echo "VITE_RECOVERY_SERVER_URL=${VITE_RECOVERY_SERVER_URL:-<unset>}"
    - echo "VITE_EMAIL_HASH_PEPPER=${VITE_EMAIL_HASH_PEPPER:+<set>}"
    - echo "VITE_ENABLE_REMEDIATION_PHASE2=${VITE_ENABLE_REMEDIATION_PHASE2:-<unset>}"
    - echo "CAPACITOR_SERVER_HOSTNAME=${CAPACITOR_SERVER_HOSTNAME:-<unset>}"
    - export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://api.prod.dip.on.adorsys.com}"
    - export VITE_RECOVERY_SERVER_URL="${VITE_RECOVERY_SERVER_URL:-https://recovery.prod.dip.on.adorsys.com}"
    - export VITE_EMAIL_HASH_PEPPER="${VITE_EMAIL_HASH_PEPPER:-}"
    # Non-prod mobile builds validate detect-and-act; override via CI/CD variable if needed.
    - export VITE_ENABLE_REMEDIATION_PHASE2="${VITE_ENABLE_REMEDIATION_PHASE2:-true}"
    - export CAPACITOR_SERVER_HOSTNAME="${CAPACITOR_SERVER_HOSTNAME:-app.prod.dip.on.adorsys.com}"
    - echo "Resolved build values:"
    - echo "  VITE_API_BASE_URL=$VITE_API_BASE_URL"
    - echo "  VITE_RECOVERY_SERVER_URL=$VITE_RECOVERY_SERVER_URL"
    - echo "  VITE_ENABLE_REMEDIATION_PHASE2=$VITE_ENABLE_REMEDIATION_PHASE2"
