# ==============================================================================
# DEPLOY — ANDROID
# ==============================================================================

# FIX: before_script now lives entirely in the anchor — do NOT redefine it here.
# YAML merge (<<:) does not deep-merge arrays; a local before_script would
# silently replace the anchor's, skipping Java and Fastlane setup entirely.
deploy:android:internal:
  stage: deploy
  tags: [aws-2xlarge]
  extends: .android-fastlane-setup
  needs:
    - job: package:android
      optional: true
    - job: package:android:qa
      optional: true
    - job: package:android:production
      optional: true
  # FIX: removed duplicate `image: ruby:3.2` (already set by anchor)
  # FIX: removed duplicate `gem install fastlane` from script (already in anchor)
  script:
    - fastlane android internal_apk
  after_script:
    - rm -f $CI_PROJECT_DIR/google-play-key.json
  rules:
    # Triggered by production tags (direct) and test pre-release tags (internal track)
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-test-\d+$/

# FIX: was completely missing google-play-key.json setup
deploy:android:production:
  stage: deploy
  tags: [aws-2xlarge]
  extends: .android-fastlane-setup
  needs:
    - job: package:android:production
      optional: true
  script:
    - fastlane android production_apk
  after_script:
    - rm -f $CI_PROJECT_DIR/google-play-key.json
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

# ==============================================================================
# DEPLOY — iOS
# ==============================================================================

deploy:ios:production:
  stage: deploy
  tags:
    - macos
    - ios
  needs:
    - job: package:ios
      optional: true
  before_script:
    # Mirror the PATH and locale setup from package:ios — fastlane must be on PATH
    # on the macOS shell executor which ignores ~/.zshrc in non-interactive mode.
    # Runner prerequisite: brew install node@24
    - export PATH="/opt/homebrew/opt/node@24/bin:/opt/homebrew/bin:$PATH"
    - export LC_ALL=en_US.UTF-8
    - export LANG=en_US.UTF-8
  script:
    - fastlane ios release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual

# ==============================================================================
# DEPLOY — SERVER (AWS ECR)
# ==============================================================================
# Pushes the @budget/server Docker image to AWS ECR using OIDC authentication.
# No static AWS credentials — uses GitLab id_tokens exchanged for temporary
# STS credentials via AssumeRoleWithWebIdentity.
#
# Tag strategy:
#   main → DEV ECR $CI_COMMIT_SHORT_SHA
#   manual QA promotion → copies the same immutable tag from DEV ECR to QA ECR
#
# Note: The AWS IAM roles (gitlab-ecr-push-dev and gitlab-ecr-push-qa) are
# currently restricted to the main branch only. To enable DEV/QA image flow from
# develop, update both role trust policies to allow develop too.
#
# AWS prerequisites:
#   - DEV ECR repositories: budget-wise/server and budget-wise/recovery-server
#     in account 113008552221, eu-central-1
#   - QA ECR repositories: budget-wise/server and budget-wise/recovery-server
#     in account 974954696093, eu-central-1
#   - OIDC Identity Provider for https://git.adorsys.de in both AWS accounts
#   - IAM roles gitlab-ecr-push-dev and gitlab-ecr-push-qa with ECR permissions
#     and a trust policy allowing AssumeRoleWithWebIdentity from the IdP

.promote-image-to-qa:
  extends: .aws-ecr-docker-job
  variables:
    DEV_AWS_ROLE_ARN: arn:aws:iam::113008552221:role/gitlab-ecr-push-dev
    QA_AWS_ROLE_ARN: arn:aws:iam::974954696093:role/gitlab-ecr-push-qa
    DEV_ECR_REGISTRY: 113008552221.dkr.ecr.eu-central-1.amazonaws.com
    QA_ECR_REGISTRY: 974954696093.dkr.ecr.eu-central-1.amazonaws.com
  script:
    - export IMAGE_TAG="${PROMOTE_IMAGE_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "Promoting $ECR_REPOSITORY:$IMAGE_TAG from DEV ECR to QA ECR"
    - assume_aws_role "$DEV_AWS_ROLE_ARN"
    - |
      SOURCE_DIGEST=$(aws ecr describe-images \
        --repository-name "$ECR_REPOSITORY" \
        --image-ids imageTag="$IMAGE_TAG" \
        --query 'imageDetails[0].imageDigest' \
        --output text 2>/dev/null || true)
      if [ -z "$SOURCE_DIGEST" ] || [ "$SOURCE_DIGEST" = "None" ]; then
        echo "FATAL: source image $DEV_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG was not found" >&2
        exit 1
      fi
      echo "Source digest: $SOURCE_DIGEST"
    - ecr_login "$DEV_ECR_REGISTRY"
    - docker pull "$DEV_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - assume_aws_role "$QA_AWS_ROLE_ARN"
    - |
      TARGET_DIGEST=$(aws ecr describe-images \
        --repository-name "$ECR_REPOSITORY" \
        --image-ids imageTag="$IMAGE_TAG" \
        --query 'imageDetails[0].imageDigest' \
        --output text 2>/dev/null || true)
      if [ "$TARGET_DIGEST" = "$SOURCE_DIGEST" ]; then
        echo "QA image already exists with the same digest; nothing to promote."
        exit 0
      fi
      if [ -n "$TARGET_DIGEST" ] && [ "$TARGET_DIGEST" != "None" ]; then
        echo "FATAL: QA image tag already exists with a different digest: $TARGET_DIGEST" >&2
        exit 1
      fi
    - ecr_login "$QA_ECR_REGISTRY"
    - docker tag "$DEV_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$QA_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - docker push "$QA_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

push-server-image:
  extends: .aws-ecr-docker-job
  variables:
    AWS_ROLE_ARN: arn:aws:iam::113008552221:role/gitlab-ecr-push-dev
    ECR_REGISTRY: 113008552221.dkr.ecr.eu-central-1.amazonaws.com
  script:
    - assume_aws_role "$AWS_ROLE_ARN"
    - ecr_login "$ECR_REGISTRY"
    # Build from monorepo root context with Dockerfile path specified
    - docker build -t $ECR_REGISTRY/budget-wise/server:$CI_COMMIT_SHORT_SHA -f packages/server/Dockerfile .
    # Push commit SHA tag
    - docker push $ECR_REGISTRY/budget-wise/server:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

promote-server-image:qa:
  extends: .promote-image-to-qa
  needs:
    - job: push-server-image
      optional: true
  variables:
    ECR_REPOSITORY: budget-wise/server

# ==============================================================================
# PROMOTE — PROD SERVER (AWS ECR)
# ==============================================================================
# Promotes the @budget/server Docker image from QA ECR to PROD ECR.
# Uses OIDC authentication for AWS credentials.
#
# AWS prerequisites:
#   - QA ECR repositories: budget-wise/server in account 974954696093
#   - PROD ECR repositories: budget-wise/server in account 872353350630
#   - OIDC Identity Provider for https://git.adorsys.de in both AWS accounts
#   - IAM role gitlab-ecr-push-qa with ECR permissions
#   - IAM role gitlab-ecr-push-prod with ECR permissions

.promote-image-to-prod:
  extends: .aws-ecr-docker-job
  variables:
    QA_AWS_ROLE_ARN: arn:aws:iam::974954696093:role/gitlab-ecr-push-qa
    PROD_AWS_ROLE_ARN: arn:aws:iam::872353350630:role/gitlab-ecr-push-prod
    QA_ECR_REGISTRY: 974954696093.dkr.ecr.eu-central-1.amazonaws.com
    PROD_ECR_REGISTRY: 872353350630.dkr.ecr.eu-central-1.amazonaws.com
  script:
    - export IMAGE_TAG="${PROMOTE_IMAGE_TAG:-$CI_COMMIT_SHORT_SHA}"
    - echo "Promoting $ECR_REPOSITORY:$IMAGE_TAG from QA ECR to PROD ECR"
    - assume_aws_role "$QA_AWS_ROLE_ARN"
    - |
      SOURCE_DIGEST=$(aws ecr describe-images \
        --repository-name "$ECR_REPOSITORY" \
        --image-ids imageTag="$IMAGE_TAG" \
        --query 'imageDetails[0].imageDigest' \
        --output text 2>/dev/null || true)
      if [ -z "$SOURCE_DIGEST" ] || [ "$SOURCE_DIGEST" = "None" ]; then
        echo "FATAL: source image $QA_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG was not found" >&2
        exit 1
      fi
      echo "Source digest: $SOURCE_DIGEST"
    - ecr_login "$QA_ECR_REGISTRY"
    - docker pull "$QA_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - assume_aws_role "$PROD_AWS_ROLE_ARN"
    - |
      TARGET_DIGEST=$(aws ecr describe-images \
        --repository-name "$ECR_REPOSITORY" \
        --image-ids imageTag="$IMAGE_TAG" \
        --query 'imageDetails[0].imageDigest' \
        --output text 2>/dev/null || true)
      if [ "$TARGET_DIGEST" = "$SOURCE_DIGEST" ]; then
        echo "PROD image already exists with the same digest; nothing to promote."
        exit 0
      fi
      if [ -n "$TARGET_DIGEST" ] && [ "$TARGET_DIGEST" != "None" ]; then
        echo "FATAL: PROD image tag already exists with a different digest: $TARGET_DIGEST" >&2
        exit 1
      fi
    - ecr_login "$PROD_ECR_REGISTRY"
    - docker tag "$QA_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$PROD_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - docker push "$PROD_ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

promote-server-image:prod:
  extends: .promote-image-to-prod
  variables:
    ECR_REPOSITORY: budget-wise/server

# ==============================================================================
# RECOVERY SERVER — separate trust boundary
# Pushes the @budget/recovery-server Docker image to AWS ECR using OIDC.
# Separate from main server push because recovery has different runtime
# requirements and a dedicated ECS service.
# ==============================================================================

push-recovery-image:
  extends: .aws-ecr-docker-job
  variables:
    AWS_ROLE_ARN: arn:aws:iam::113008552221:role/gitlab-ecr-push-dev
    ECR_REGISTRY: 113008552221.dkr.ecr.eu-central-1.amazonaws.com
  script:
    - assume_aws_role "$AWS_ROLE_ARN"
    - ecr_login "$ECR_REGISTRY"
    # Build from monorepo root context with Dockerfile path specified
    - docker build -t $ECR_REGISTRY/budget-wise/recovery-server:$CI_COMMIT_SHORT_SHA -f packages/recovery-server/Dockerfile .
    # Push commit SHA tag
    - docker push $ECR_REGISTRY/budget-wise/recovery-server:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

promote-recovery-image:qa:
  extends: .promote-image-to-qa
  needs:
    - job: push-recovery-image
      optional: true
  variables:
    ECR_REPOSITORY: budget-wise/recovery-server

promote-recovery-image:prod:
  extends: .promote-image-to-prod
  variables:
    ECR_REPOSITORY: budget-wise/recovery-server

recovery:lint:
  stage: quality
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  extends: .nx-setup
  script:
    - npx nx run recovery-server:lint
  needs:
    - install
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

recovery:test:
  stage: quality
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  extends: .nx-setup
  script:
    - |
      set -e
      export NODE_OPTIONS="--max-old-space-size=4096"
      export NX_DAEMON=false
      export NX_VERBOSE_LOGGING=false
      mkdir -p coverage/recovery-server
      npx nx run recovery-server:test
  needs:
    - install
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/recovery-server/**/cobertura-coverage.xml
    paths:
      - coverage/recovery-server/
    expire_in: 1 week

recovery:typecheck:
  stage: build
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  extends: .nx-setup
  script:
    - npx nx run recovery-server:typecheck
  needs:
    - install
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

recovery:build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  interruptible: true
  extends: .nx-setup
  script:
    - npx nx run recovery-server:build
  needs:
    - install
  allow_failure: false
  artifacts:
    paths:
      - packages/recovery-server/dist/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

recovery:health-check:
  stage: build
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  needs:
    - recovery:build
  extends: .nx-setup
  script:
    - |
      set -e
      # Install production deps so the built ESM bundle can resolve fastify etc.
      pnpm install --frozen-lockfile --prod --filter @budget/recovery-server...
      # Start the built binary in the background; secrets not needed for /health
      NODE_ENV=test node packages/recovery-server/dist/main.js &
      SERVER_PID=$!
      # Wait for the server to be ready (up to 15s)
      for i in $(seq 1 15); do
        if wget -qO- http://127.0.0.1:3001/health > /tmp/health_response.json 2>/dev/null; then
          break
        fi
        echo "Waiting for recovery server... ($i/15)"
        sleep 1
      done
      # Assert response matches expected shape
      RESPONSE=$(cat /tmp/health_response.json 2>/dev/null || echo '{}')
      echo "Health response: $RESPONSE"
      echo "$RESPONSE" | grep -q '"status":"ok"' || (echo "FAIL: status != ok" && kill $SERVER_PID 2>/dev/null; exit 1)
      echo "$RESPONSE" | grep -q '"service":"recovery"' || (echo "FAIL: service != recovery" && kill $SERVER_PID 2>/dev/null; exit 1)
      echo "Health check passed"
      kill $SERVER_PID 2>/dev/null || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ==============================================================================
# RELEASE & CLEANUP
# ==============================================================================

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags: [aws-2xlarge]
  script:
    - echo "Release ${CI_COMMIT_TAG} created via GitLab CI native release feature"
  needs:
    - build:mobile:production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release ${CI_COMMIT_TAG}"

stop:preview:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags: [aws-2xlarge]
  script:
    - echo "Preview environment stopped"
  environment:
    name: preview/${CI_COMMIT_REF_NAME}
    action: stop
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
  needs: []
