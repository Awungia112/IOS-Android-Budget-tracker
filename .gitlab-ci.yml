# ------------------------------
# Package iOS (Simulator)
# ------------------------------
# Runs on: Mac runner (on-premise, GDPR compliant)
# Tool: Capacitor + Xcode
# Output: .app file (simulator only, no code signing)
# Purpose: Test pipeline without Apple Developer account
# Trigger: v*.*.*-test tags (auto) or manual on release tags
package:ios:simulator:
  stage: package
  tags:
    - macos
    - ios
  variables:
    GIT_DEPTH: "0"
  needs:
    - job: build:mobile:staging
      optional: true
  before_script:
    # NOTE: macOS Shell Executors run in non-interactive mode and ignore user profiles (~/.zshrc).
    # We explicitly prepend the Homebrew Node@24 path to ensure Corepack and Node are found,
    # maintaining pnpm version parity with the rest of the pipeline.
    # Runner prerequisite: brew install node@24
    - export PATH="/opt/homebrew/opt/node@24/bin:/opt/homebrew/bin:$PATH"
    - echo "Node version:" && node --version
    - echo "Xcode version:" && xcodebuild -version
    - corepack enable
    - |
      if [ -z "${PNPM_VERSION}" ]; then
        echo "Error: PNPM_VERSION is not set!"
        exit 1
      fi
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - export FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT=120
    - export FASTLANE_XCODEBUILD_SETTINGS_RETRIES=6
    - echo "CAPACITOR_SERVER_HOSTNAME=${CAPACITOR_SERVER_HOSTNAME:-<unset>}"
    - export CAPACITOR_SERVER_HOSTNAME="${CAPACITOR_SERVER_HOSTNAME:-app.prod.dip.on.adorsys.com}"
    - echo "Resolved iOS simulator package values:"
    - echo "  CAPACITOR_SERVER_HOSTNAME=$CAPACITOR_SERVER_HOSTNAME"
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec cap sync ios
    - fastlane ios simulator
  artifacts:
    paths:
      - build/BudgetWise-simulator.app
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-test-\d+$/
      when: manual

