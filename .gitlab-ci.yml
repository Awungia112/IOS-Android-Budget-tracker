deploy:preview:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  retry:
    max: 2
    when: script_failure
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir $PNPM_CACHE_FOLDER
  script:
    - pnpm install --frozen-lockfile --prefer-offline --reporter=silent
    - pnpm --filter @budget/shared run build
    - pnpm --filter @budget/core run build
    - VITE_API_BASE_URL="${VITE_API_BASE_URL}" VITE_RECOVERY_SERVER_URL="${VITE_RECOVERY_SERVER_URL}" VITE_EMAIL_HASH_PEPPER="${VITE_EMAIL_HASH_PEPPER}" VITE_ENABLE_REMEDIATION_PHASE2="${VITE_ENABLE_REMEDIATION_PHASE2:-true}" pnpm --filter @budget/app run build
    - npx wrangler pages deploy dist --project-name=${CF_PROJECT_NAME} --branch=${CI_COMMIT_REF_NAME}
  environment:
    name: preview/${CI_COMMIT_REF_NAME}
    url: https://${CI_COMMIT_REF_SLUG}.${CF_PROJECT_NAME}.pages.dev
    on_stop: stop:preview
  needs:
    - lint
    - test
    - typecheck
    - test:integration
    - e2e
    - lighthouse
  rules:
    - if: '$CI_MERGE_REQUEST_ID'

deploy:staging:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  tags: [aws-2xlarge]
  retry:
    max: 2
    when: script_failure
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir $PNPM_CACHE_FOLDER
  script:
    - echo "=== Environment Variables ==="
    - echo "VITE_API_BASE_URL=${VITE_API_BASE_URL}"
    - echo "VITE_RECOVERY_SERVER_URL=${VITE_RECOVERY_SERVER_URL}"
    - echo "VITE_EMAIL_HASH_PEPPER=${VITE_EMAIL_HASH_PEPPER}"
    - echo "VITE_ENABLE_REMEDIATION_PHASE2=${VITE_ENABLE_REMEDIATION_PHASE2:-<unset>}"
    - echo "CI_ENVIRONMENT_NAME=${CI_ENVIRONMENT_NAME}"
    - echo "CI_COMMIT_BRANCH=${CI_COMMIT_BRANCH}"
    - echo "=== Checking if variables contain dev domain ==="
    - | 
      if echo "$VITE_API_BASE_URL" | grep -q "dev.dip.on.adorsys.com"; then
        echo "✓ VITE_API_BASE_URL contains dev domain"
      else
        echo "✗ VITE_API_BASE_URL does NOT contain dev domain"
        echo "  Actual value: $VITE_API_BASE_URL"
      fi
    - | 
      if echo "$VITE_RECOVERY_SERVER_URL" | grep -q "dev.dip.on.adorsys.com"; then
        echo "✓ VITE_RECOVERY_SERVER_URL contains dev domain"
      else
        echo "✗ VITE_RECOVERY_SERVER_URL does NOT contain dev domain"
        echo "  Actual value: $VITE_RECOVERY_SERVER_URL"
      fi
    - pnpm install --frozen-lockfile --prefer-offline --reporter=silent
