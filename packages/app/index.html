<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>My Budget - Expenses under control</title>
    <meta
      name="description"
      content="My Budget - Expenses under control: Die kostenlose App zur Übersicht Ihrer Finanzen."
    />
    <meta name="author" content="Deutschland im Plus" />

    <meta property="og:title" content="My Budget - Expenses under control" />
    <meta
      property="og:description"
      content="Die kostenlose App zur Übersicht Ihrer Finanzen"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/MyBudget.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/MyBudget.webp" />

<link rel="icon" href="/assets/deutshland-im-plus.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/assets/deutshland-im-plus.webp" />
    <link rel="manifest" href="/assets/manifest.json" />
    <!-- Theme color matches header background (#3A464F) for consistent status bar on Android -->
    <meta name="theme-color" content="#3A464F" />
    
    <!-- Performance Optimizations -->
    <style>
      /* Critical CSS for above-the-fold content */
      /* CSS custom properties mirror the source of truth in: packages/app/src/index.css */
      /* If updating theme colors, also update the corresponding values in index.css @layer base */
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --primary: 210 100% 56%;
        --card: 0 0% 100%;
        --border: 214.3 31.8% 91.4%;
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />
    <!-- Inline theme script: applies dark/light class synchronously before first paint
         to prevent flash of wrong theme. Must run before any CSS or React renders. -->
    <script>
      (function() {
        var stored = localStorage.getItem('budget-wise-theme');
        var theme = stored === 'dark' || stored === 'light' ? stored : 'system';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
