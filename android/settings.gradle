include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

// @sentry/capacitor Android module — registered manually since pnpm's flat
// structure prevents `cap sync` from discovering it. This settings.gradle
// is NOT regenerated by `cap sync` (only capacitor.settings.gradle is),
// so it is safe to add modules here permanently.
include ':sentry-capacitor'
project(':sentry-capacitor').projectDir = new File('../node_modules/@sentry/capacitor/android')

apply from: 'capacitor.settings.gradle'
